name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format, l10n & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Comprova sincronització de traduccions (ARB i gen-l10n)
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
          python3 - <<'PY'
          import json, pathlib, sys
          arbs = sorted(pathlib.Path('lib/l10n').glob('app_*.arb'))
          keys = {
              p.name: {
                  k for k in json.loads(p.read_text(encoding='utf-8'))
                  if not k.startswith('@')
              }
              for p in arbs
          }
          all_keys = set().union(*keys.values())
          missing = {name: sorted(all_keys - k) for name, k in keys.items() if all_keys - k}
          if missing:
              for name, m in missing.items():
                  print(
                      f'::error file=lib/l10n/{name}::'
                      f'Falten {len(m)} claus de traducció: {", ".join(m[:10])}'
                  )
              sys.exit(1)
          print(f'ARB sincronitzats: {len(arbs)} idiomes, {len(all_keys)} claus cadascun.')
          PY

      # Els fitxers de Firebase no es versionen (DP-004). Placeholder sense claus per a analyze.
      - name: Fitxer de Firebase de mostra
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder',
            );
          }
          EOF

      - run: flutter analyze

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Fitxer de Firebase de mostra
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder',
            );
          }
          EOF

      - run: flutter test --coverage

      - name: Resum de cobertura (excloent l10n i firebase_options)
        run: |
          python3 - <<'PY'
          import os, pathlib
          lcov = pathlib.Path('coverage/lcov.info').read_text(encoding='utf-8').splitlines()
          total = hit = 0
          skip = False
          for line in lcov:
              if line.startswith('SF:'):
                  path = line[3:].replace('\\', '/')
                  skip = path.startswith('lib/l10n/app_localizations') or path == 'lib/firebase_options.dart'
              elif not skip and line.startswith('DA:'):
                  parts = line[3:].split(',')
                  total += 1
                  if int(parts[1]) > 0:
                      hit += 1
          pct = (hit / total * 100) if total else 0.0
          summary = f'### Cobertura Flutter\n- Línies cobertes: **{hit} / {total} ({pct:.1f}%)** (excloent `lib/l10n/app_localizations*.dart` i `lib/firebase_options.dart`)\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov-coverage
          path: coverage/lcov.info
          retention-days: 7

  sonarcloud:
    name: SonarQube Cloud
    needs: [test]
    # Els secrets no s'injecten en PR provinents de forks externs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarQube Cloud necessita l'historial complet per al blame i la detecció de codi nou.
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get --enforce-lockfile

      # lib/main.dart importa firebase_options.dart: sense el placeholder, l'analitzador Dart no el resol.
      - name: Fitxer de Firebase de mostra
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder',
            );
          }
          EOF

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lcov-coverage
          path: coverage

      - name: Comprova informe LCOV
        run: test -s coverage/lcov.info

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Fitxers de Firebase de mostra
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder',
            );
          }
          EOF
          cat > android/app/google-services.json <<'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"cat.fiveguys.aprop"}},"api_key":[{"current_key":"ci-placeholder"}]}],"configuration_version":"1"}
          EOF

      - run: flutter build apk --debug

      # En push a develop/master o execució manual, comprova també el paquet release (#250).
      - name: Build Android APK (release)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: flutter build apk --release

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Fitxer de Firebase de mostra
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder',
            );
          }
          EOF

      - run: flutter build web --no-pub

  integration-android:
    name: Android Integration Smoke Test
    # En PR només si porta l'etiqueta `run-e2e`; sempre en push a develop/master o execució manual.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Fitxers de Firebase de mostra
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder',
            );
          }
          EOF
          cat > android/app/google-services.json <<'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"cat.fiveguys.aprop"}},"api_key":[{"current_key":"ci-placeholder"}]}],"configuration_version":"1"}
          EOF

      - name: Habilita permisos KVM per a l'emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Executa integration_test en emulador Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          ram-size: 4096m
          disable-animations: true
          script: flutter test integration_test/app_smoke_test.dart
