# Configuració de SonarQube Cloud per al client Flutter d'AProp!
# Projecte: https://sonarcloud.io/project/overview?id=pes2627q1-22-gei-upc_frontend-aprop
sonar.projectKey=pes2627q1-22-gei-upc_frontend-aprop
sonar.organization=pes2627q1-22-gei-upc

sonar.sourceEncoding=UTF-8

# Exclou els fitxers generats per flutter gen-l10n (~9.300 línies sense marca
# «Generated») i lib/firebase_options.dart (no versionat; placeholder a CI, DP-004).
sonar.exclusions=lib/l10n/app_localizations*.dart,lib/firebase_options.dart
# SonarQube Cloud analitza tot el repo (sonar.sources/sonar.tests no tenen efecte):
# les proves no compten per a la cobertura ni per a la duplicació.
sonar.coverage.exclusions=lib/l10n/app_localizations*.dart,lib/firebase_options.dart,test/**,integration_test/**
sonar.cpd.exclusions=test/**,integration_test/**

# Cobertura generada per `flutter test --coverage`
sonar.dart.lcov.reportPaths=coverage/lcov.info
